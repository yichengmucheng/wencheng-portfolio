<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">MaaS 百事通总体架构</title>
  <desc id="desc">飞书入口经过身份策略和业务控制面，进入 Hermes Runtime，再由能力网关受控调用企业工具，最后通过审批和交付返回结果。Task、Evidence、Approval、Delivery、Preference Memory 与 Knowledge 分离存储。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10141d"/><stop offset="1" stop-color="#090b10"/></linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ff45"/><stop offset="1" stop-color="#8ee82a"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a2444"/><stop offset="1" stop-color="#151827"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667181"/></marker>
    <style>
      .t{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#eff2f7}.mono{font-family:Consolas,'SFMono-Regular',monospace}.muted{fill:#98a3b2}.dim{fill:#697585}.h1{font-size:42px;font-weight:600;letter-spacing:-1.5px}.sub{font-size:16px}.label{font-size:12px;font-weight:700;letter-spacing:2px}.node-title{font-size:22px;font-weight:600}.node-sub{font-size:14px}.tiny{font-size:12px}.store-title{font-size:15px;font-weight:600}.status{font-size:10px;font-weight:700;letter-spacing:1px}.line{stroke:#667181;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/>
  <g opacity=".22" stroke="#fff" stroke-width="1"><path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600"/><path d="M100 0V1040M200 0V1040M300 0V1040M400 0V1040M500 0V1040M600 0V1040M700 0V1040M800 0V1040M900 0V1040M1000 0V1040M1100 0V1040M1200 0V1040M1300 0V1040M1400 0V1040M1500 0V1040"/></g>

  <text x="76" y="82" class="t label" fill="#c8ff45">MAAS BAISHITONG / SYSTEM ARCHITECTURE</text>
  <text x="76" y="135" class="t h1">一个入口、一个任务真相源、一道副作用代码门</text>
  <text x="76" y="171" class="t sub muted">Hermes 负责推理与工具编排；身份、任务状态、审批与交付由业务控制面掌握。</text>

  <g class="t" filter="url(#shadow)">
    <rect x="76" y="242" width="214" height="214" rx="24" fill="#151a24" stroke="#303746"/>
    <rect x="96" y="262" width="76" height="24" rx="12" fill="#c8ff45"/>
    <text x="134" y="279" text-anchor="middle" class="status" fill="#0a0c10">已实现</text>
    <text x="104" y="337" class="node-title">飞书入口</text>
    <text x="104" y="369" class="node-sub muted">WebSocket / Webhook</text>
    <text x="104" y="397" class="node-sub muted">验签 · 去重 · 快速 ACK</text>
    <text x="104" y="425" class="node-sub muted">文本 · 卡片 · 文件</text>

    <rect x="334" y="242" width="214" height="214" rx="24" fill="#151a24" stroke="#303746"/>
    <rect x="354" y="262" width="76" height="24" rx="12" fill="#c8ff45"/>
    <text x="392" y="279" text-anchor="middle" class="status" fill="#0a0c10">已实现</text>
    <text x="362" y="337" class="node-title">身份与策略</text>
    <text x="362" y="369" class="node-sub muted">IdentityBinding</text>
    <text x="362" y="397" class="node-sub muted">user / chat / bot / scope</text>
    <text x="362" y="425" class="node-sub muted">模型不可覆盖认证身份</text>

    <rect x="592" y="222" width="294" height="254" rx="28" fill="url(#control)"/>
    <rect x="612" y="242" width="76" height="24" rx="12" fill="#0a0c10" opacity=".86"/>
    <text x="650" y="259" text-anchor="middle" class="status" fill="#c8ff45">核心已实现</text>
    <text x="624" y="320" class="node-title" fill="#0a0c10">业务控制面</text>
    <text x="624" y="354" class="node-sub" fill="#24300e">Task / Job / Step / Artifact</text>
    <text x="624" y="383" class="node-sub" fill="#24300e">Context Assembler · Checkpoint</text>
    <text x="624" y="412" class="node-sub" fill="#24300e">Approval · Evidence · Idempotency</text>
    <text x="624" y="441" class="node-sub" fill="#24300e">业务状态不依赖对话历史</text>

    <rect x="930" y="242" width="214" height="214" rx="24" fill="url(#runtime)" stroke="#6558a3"/>
    <rect x="950" y="262" width="76" height="24" rx="12" fill="#9276ff"/>
    <text x="988" y="279" text-anchor="middle" class="status" fill="#0a0c10">已接入</text>
    <text x="958" y="337" class="node-title">Hermes Runtime</text>
    <text x="958" y="369" class="node-sub muted">Session · Tool Loop · MCP</text>
    <text x="958" y="397" class="node-sub muted">Subagent · Cron · Budget</text>
    <text x="958" y="425" class="node-sub muted">不拥有业务最终权限</text>

    <rect x="1188" y="242" width="214" height="214" rx="24" fill="#151a24" stroke="#303746"/>
    <rect x="1208" y="262" width="76" height="24" rx="12" fill="#c8ff45"/>
    <text x="1246" y="279" text-anchor="middle" class="status" fill="#0a0c10">已实现</text>
    <text x="1216" y="337" class="node-title">能力网关</text>
    <text x="1216" y="369" class="node-sub muted">Capability Catalog</text>
    <text x="1216" y="397" class="node-sub muted">read / write / risk / scope</text>
    <text x="1216" y="425" class="node-sub muted">公司工具 · lark-cli · MCP</text>
  </g>

  <path d="M290 349H326" class="line"/><path d="M548 349H584" class="line"/><path d="M886 349H922" class="line"/><path d="M1144 349H1180" class="line"/>

  <g class="t" filter="url(#shadow)">
    <rect x="334" y="524" width="810" height="118" rx="24" fill="#151a24" stroke="#303746"/>
    <text x="370" y="570" class="node-title">Approval &amp; Delivery</text>
    <text x="370" y="603" class="node-sub muted">preview → explicit confirm → execute → receipt</text>
    <rect x="892" y="548" width="216" height="66" rx="14" fill="#0f131b" stroke="#c8ff45" stroke-opacity=".35"/>
    <text x="1000" y="574" text-anchor="middle" class="tiny muted">幂等交付回执</text>
    <text x="1000" y="598" text-anchor="middle" class="mono tiny" fill="#c8ff45">message_id · trace_id</text>
  </g>
  <path d="M1295 456V492H739V516" class="line"/>

  <text x="76" y="720" class="t label" fill="#c8ff45">SEPARATED STATE STORES</text>
  <g class="t">
    <g><rect x="76" y="748" width="216" height="126" rx="18" fill="#131720" stroke="#c8ff45" stroke-opacity=".42"/><text x="98" y="787" class="store-title">Task Store</text><text x="98" y="816" class="tiny muted">目标 · 焦点实体 · 执行状态</text><text x="98" y="842" class="tiny muted">SQLite 已实现</text></g>
    <g><rect x="314" y="748" width="216" height="126" rx="18" fill="#131720" stroke="#c8ff45" stroke-opacity=".42"/><text x="336" y="787" class="store-title">Evidence Store</text><text x="336" y="816" class="tiny muted">来源 · 时间 · 工具结果</text><text x="336" y="842" class="tiny muted">TTL 自动刷新规划中</text></g>
    <g><rect x="552" y="748" width="216" height="126" rx="18" fill="#131720" stroke="#c8ff45" stroke-opacity=".42"/><text x="574" y="787" class="store-title">Approval Store</text><text x="574" y="816" class="tiny muted">审批人 · Payload · 有效期</text><text x="574" y="842" class="tiny muted">已实现精确校验</text></g>
    <g><rect x="790" y="748" width="216" height="126" rx="18" fill="#131720" stroke="#c8ff45" stroke-opacity=".42"/><text x="812" y="787" class="store-title">Delivery Store</text><text x="812" y="816" class="tiny muted">幂等键 · message_id · 回执</text><text x="812" y="842" class="tiny muted">已实现失败释放与重试</text></g>
    <g><rect x="1028" y="748" width="216" height="126" rx="18" fill="#171525" stroke="#9276ff" stroke-dasharray="7 6"/><text x="1050" y="787" class="store-title">Preference Memory</text><text x="1050" y="816" class="tiny muted">明确授权的稳定个人偏好</text><text x="1050" y="842" class="tiny muted">团队级 Memory 规划中</text></g>
    <g><rect x="1266" y="748" width="258" height="126" rx="18" fill="#201914" stroke="#ffae62"/><text x="1288" y="787" class="store-title">Knowledge Base</text><text x="1288" y="816" class="tiny muted">组织文档 · 权限继承 · 引用</text><text x="1288" y="842" class="tiny muted">Mock 验收 / ACL 待接入</text></g>
  </g>
  <path d="M739 642V700H184V740M739 700H422V740M739 700H660V740M739 700H898V740M739 700H1136V740M739 700H1395V740" stroke="#46505e" stroke-width="1.5" fill="none"/>

  <g class="t">
    <circle cx="78" cy="948" r="6" fill="#c8ff45"/><text x="94" y="953" class="tiny muted">已实现：代码与测试可核验</text>
    <circle cx="330" cy="948" r="6" fill="#ffae62"/><text x="346" y="953" class="tiny muted">Mock 验收：生产适配器存在，未接真实业务数据</text>
    <circle cx="760" cy="948" r="6" fill="none" stroke="#9276ff" stroke-dasharray="3 2"/><text x="776" y="953" class="tiny muted">规划中：企业生产化能力</text>
    <text x="1524" y="953" text-anchor="end" class="mono tiny dim">2026-09 · v1</text>
  </g>
</svg>

